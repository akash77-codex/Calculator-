<html>
    <head>
        <title>Calculator version 2.0</title>
     
        <link rel="stylesheet" href="Cal2.0.css">
    
        <script>
            
            
    function display(num){

          document.getElementById("result").value += num;
          
          

    }

    function calcalutor(){

      let result = eval(document.getElementById("result").value);

          document.getElementById("result").value = result;
          

    }
    
    function remove(){

          document.getElementById("result").value="";
          
    }
        </script>    
    
      </head>

    <body>

        <div class="cal">

        <div class="a"><input type="text" id="result" placeholder="0"></div>

          <div class="contanor">

            <div class="box">

          <button onclick="remove('0')" class="AC">AC</button>
                
          <button onclick="display('%')" class="AC">%</button>
          <button onclick="display('X')" class="AC">X</button>
          <button onclick="display('/')" class="AC">/</button>
          <button onclick="display('1')">1</button>
          <button onclick="display('2')">2</button>
          <button onclick="display('3')">3</button>
          <button onclick="display('*')" class="AC">*</button>
          <button onclick="display('4')">4</button>
          <button onclick="display('5')">5</button>
          <button onclick="display('6')">6</button>
          <button onclick="display('-')" class="AC">-</button>
          <button onclick="display('7')">7</button>
          <button onclick="display('8')">8</button>
          <button onclick="display('9')">9</button>
          <button onclick="display('+')" class="AC">+</button>
          <button onclick="display('00')">00</button>
          <button onclick="display('0')">0</button>
          <button onclick="display('.')">.</button>

          <button onclick="calcalutor()" class="s">=</button>
  
             </div>
            </div>   
          </div>     
    </body>
</html>
